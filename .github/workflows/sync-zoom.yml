# =====================================================================
#  Sync Zoom (optional) — every day, ask Zoom for the current join link and
#  passcode of the meeting ID in site.json. If anything changed, commit it
#  and redeploy, so the site, QR codes, poster and calendar file follow
#  the Zoom meeting automatically. (The official flyer is a fixed image and
#  does not; the flyer pages then flag its printed Zoom details as stale.)
#
#  Does nothing unless three repository secrets exist (Settings → Secrets
#  and variables → Actions): ZOOM_ACCOUNT_ID, ZOOM_CLIENT_ID,
#  ZOOM_CLIENT_SECRET — from a Zoom "Server-to-Server OAuth" app with the
#  meeting:read:meeting (or meeting:read:admin) scope, in the Zoom account
#  that owns the workshop meeting. See docs/SETUP-GITHUB.md.
# =====================================================================
name: Sync Zoom

on:
  schedule:
    - cron: "37 14 * * *"   # daily, 14:37 UTC = 9:37 AM Eastern in winter (EST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  sync:
    name: Compare with Zoom
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Ask Zoom
        id: sync
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: node scripts/sync-zoom.mjs

      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/site.json
          git commit -m "Sync Zoom details from Zoom ($SUMMARY)"
          git push

      - name: Summary
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Rebuild & deploy
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/deploy.yml
